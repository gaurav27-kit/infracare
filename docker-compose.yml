# ─── InfraCare — Docker Compose ───────────────────────────────────────────────
# Orchestrates PostgreSQL database and Express backend containers.
#
# Usage:
#   docker compose build        # Build backend image
#   docker compose up           # Start all services (PostgreSQL + Backend)
#   docker compose up -d        # Start in background
#   docker compose down         # Stop services
#   docker compose logs -f      # Tail logs

services:

  # ─── Database (PostgreSQL) ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: infracare-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_campus_fix}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-smart_campus_fix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infracare-net

  # ─── Backend (Express + Node.js) ───────────────────────────────────────────
  backend:
    container_name: infracare-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_campus_fix}?schema=public
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infracare-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  infracare-net:
    driver: bridge
